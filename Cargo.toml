[workspace]
resolver = "2"
exclude = ["crates/client-services", "Pumpkin-master"]
members = [
    "crates/api",
    "crates/protocol",
    "crates/session",
    "crates/vanilla-data",
    "crates/nbt",
    "crates/world",
    "crates/simulation",
    "crates/entity",
    "crates/rpg",
    "crates/compat",
    "crates/economy",
    "crates/permission",
    "crates/persistence",
    "crates/observability",
    "crates/arcartx",
    "server",
    "tools",
    "tests/integration-harness",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.bench]
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"
